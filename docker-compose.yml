services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    container_name: maze-backend
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./FrontEnd/react
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    container_name: maze-frontend
    restart: unless-stopped

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
       - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
