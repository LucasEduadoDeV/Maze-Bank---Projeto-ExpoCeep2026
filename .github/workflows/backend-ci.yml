name: MazeBank CI

on:
  push:
    branches: [master]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13

      - name: Install dependencies
        working-directory: BackEnd
        run: npm ci

      - name: Run tests
        working-directory: BackEnd
        run: npm test

      - name: Type check
        working-directory: BackEnd
        run: npx tsc --noEmit

      - name: Docker build check
        run: docker build -t maze-backend:ci ./BackEnd
  
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13

      - name: Install dependencies
        working-directory: FrontEnd/react
        run: npm ci

      - name: Build frontend
        working-directory: FrontEnd/react
        run: npm run build

  publish-images:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./BackEnd
          push: true
          tags: |
            lucaseduardodev/maze-bank-backend:${{ github.sha }}
            lucaseduardodev/maze-bank-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontEnd/react
          push: true
          tags: |
            lucaseduardodev/maze-bank-frontend:${{ github.sha }}
            lucaseduardodev/maze-bank-frontend:latest