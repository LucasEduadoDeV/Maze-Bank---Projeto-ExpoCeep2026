jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13-slim

      - name: Install dependencies
        working-directory: BackEnd
        run: npm ci

      - name: Run tests
        working-directory: BackEnd
        run: npm test