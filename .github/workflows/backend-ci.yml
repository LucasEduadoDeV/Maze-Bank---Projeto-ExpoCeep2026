name: MazeBank CI

on:
  push:
    branches: [master]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13

      - name: Install dependencies
        working-directory: BackEnd
        run: npm ci

      - name: Run tests
        working-directory: BackEnd
        run: npm test

      - name: Type check
        working-directory: BackEnd
        run: npx tsc --noEmit

      - name: Docker build check
        run: docker build -t maze-backend:ci ./BackEnd
  
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13

      - name: Install dependencies
        working-directory: FrontEnd/react
        run: npm ci

      - name: Build frontend
        working-directory: FrontEnd/react
        run: npm run build